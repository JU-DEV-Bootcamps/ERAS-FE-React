name: Pull request workflow

# The FE-React gates of openspec/sides.conf in the ERAS parent repository (AGENTS.md section 8.7):
# lint, typecheck, test:ci (coverage of at least 15% lines, enforced by vite.config.ts) and build.
# Every step blocks the pull request; there is no continue-on-error.
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:ci

      - name: Build
        run: npm run build
