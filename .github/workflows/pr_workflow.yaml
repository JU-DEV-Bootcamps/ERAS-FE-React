name: Pull request workflow

# The FE-React gates of openspec/sides.conf in the ERAS parent repository (AGENTS.md section 8.7):
# lint, typecheck, test:ci (coverage of at least 15% lines, enforced by vite.config.ts) and build,
# plus the dependency audit of ADR-0017. Every step blocks the pull request; there is no continue-on-error.
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces (ADR-0017).
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA, never to a movable tag (ADR-0017).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No dependency runs its install scripts in CI (ADR-0017).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:ci

      - name: Build
        run: npm run build
